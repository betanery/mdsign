# Verificação automática a cada envio (auditoria 16/10/2026, Fase 3 item 12).
# Não publica nada: a publicação continua sendo pelo Lovable.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Instalar dependências (lockfile congelado)
        run: bun install --frozen-lockfile
      - name: Tipos
        run: bunx tsc --noEmit
      - name: Lint
        run: bunx eslint src --quiet
      - name: Testes
        run: bunx vitest run
      - name: Build
        run: bunx vite build
      - name: Dependências vulneráveis (falha em alta ou crítica)
        run: bun audit --audit-level=high

  # Funções do servidor (Deno): tipos das 22 funções e testes da lógica (sem rede, sem banco).
  # Roda numa cópia da pasta supabase: o Deno não deve tocar o node_modules da raiz.
  servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.6"
      - name: Tipos e testes das funções
        env:
          SUPABASE_URL: http://127.0.0.1:9
          SUPABASE_SERVICE_ROLE_KEY: teste
          SUPABASE_ANON_KEY: teste
        run: |
          cp -R supabase "$RUNNER_TEMP/supabase"
          cd "$RUNNER_TEMP/supabase"
          deno check functions/*/index.ts
          deno test -A tests/
